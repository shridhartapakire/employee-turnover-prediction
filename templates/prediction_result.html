{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Prediction Results</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <nav class="navbar">
        <div class="logo">Employee Turnover</div>

        <div class="nav-links">
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>
    </nav>

    <main class="hero">

        <h1>Prediction Results</h1>

        <p>
            Dataset: {{ filename }}
        </p>

        <h2>{{ turnover_count }}</h2>
        <p>Employees predicted to leave</p>

        <h2>{{ average_probability }}%</h2>
        <p>Average turnover probability</p>

        <a href="{% url 'home' %}" class="button">
            Back to Home
        </a>

    </main>

</body>
</html>
